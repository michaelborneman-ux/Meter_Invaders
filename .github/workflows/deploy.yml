# Publishes the site to GitHub Pages on every push to main.
# Before publishing, the ?v= on the styles.css / app.js links in index.html is
# replaced with the commit ID, so browsers always fetch the new files instead
# of reusing old cached copies. No need to bump it by hand.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy site and stamp version on CSS/JS links
        run: |
          rsync -a --exclude .git --exclude .github ./ _site/
          V="${GITHUB_SHA::7}"
          sed -i -E "s/(styles\.css|app\.js)\?v=[^\"']*/\1?v=${V}/g" _site/index.html
          grep -q "app.js?v=${V}" _site/index.html
          grep -q "styles.css?v=${V}" _site/index.html
          echo "Stamped version ${V}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
